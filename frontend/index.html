<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trợ lý học tập - Hỏi đáp sách giáo khoa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tích hợp KaTeX Render Toán học -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- Đã đổi icon chart thành icon book cho đúng ngữ cảnh học tập -->
    <symbol id="i-book-logo" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-thumbs-up" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></symbol>
    <symbol id="i-thumbs-down" viewBox="0 0 24 24"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-external-link" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-panel-left" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
  </svg>

  <header class="app-header">
    <div class="logo-container">
      <div class="logo-icon"><svg class="i"><use href="#i-book-logo"/></svg></div>
      <div class="logo-text"><h1>Trợ lý học tập</h1><span>Hỏi đáp sách giáo khoa</span></div>
    </div>
    <div class="h-actions">
      <div class="status-badge" id="status"><span class="status-dot"></span><span id="status-text">Đang kiểm tra…</span></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <!-- Nguồn (Left Panel) -->
    <aside class="src-panel" id="src-panel">
      <div class="panel-h">
        <div class="flex-center">
          <button class="icon-btn" id="hide-src-btn" title="Thu gọn cột nguồn"><svg class="i"><use href="#i-panel-left"/></svg></button>
          <span>Nguồn <small id="src-count">0</small></span>
        </div>
      </div>
      <div class="panel-b">
        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Thêm file PDF">
          <svg class="i lg dz-icon"><use href="#i-upload"/></svg>
          <b class="dz-t">Tải tài liệu lên</b>
          <span class="dz-s">Kéo thả PDF hoặc bấm để chọn</span>
        </div>
        <input type="file" id="file-input" accept=".pdf,application/pdf" multiple hidden>
        
        <div class="select-all-row" id="select-all-row" hidden>
          <label class="select-all"><input type="checkbox" id="select-all"> Chọn tất cả</label>
          <button class="bulk-del-btn" id="bulk-del-btn" hidden aria-label="Xóa các tài liệu đã chọn">
            <svg class="i"><use href="#i-trash"/></svg><span id="bulk-del-label"></span>
          </button>
        </div>
        <span class="sum" id="sel-sum"></span>
        <div id="src-list"></div>
      </div>
    </aside>

    <!-- Cuộc trò chuyện (Middle) -->
    <main class="chat-panel">
      <div class="panel-h">
        <div class="flex-center">
          <button class="icon-btn" id="show-src-btn" title="Mở cột nguồn" style="display:none;"><svg class="i"><use href="#i-panel-left"/></svg></button>
          <span>Cuộc trò chuyện</span>
        </div>
        <div class="h-actions">
          <!-- Nút Xóa được đưa ra xa, thêm text cảnh báo khi click -->
          <button class="icon-btn" id="clear-btn" title="Xóa hội thoại"><svg class="i"><use href="#i-trash"/></svg></button>
          <button class="ghost-btn" id="cites-toggle" aria-expanded="false"><svg class="i"><use href="#i-book"/></svg>Trích dẫn</button>
        </div>
      </div>
      
      <div id="chat-container" class="chat-container">
        <div class="message-row assistant" data-static>
          <div class="message-content">
            <div class="bubble ai-bubble">Xin chào! Bạn có thể hỏi ngay về dữ liệu có sẵn, hoặc tải PDF để khoanh vùng tra cứu.</div>
          </div>
        </div>
      </div>

      <div class="input-container">
        <div class="composer">
          <textarea id="user-input" rows="1" placeholder="Nhập câu hỏi của bạn…" aria-label="Câu hỏi"></textarea>
          <button class="send-btn" id="send-btn" title="Gửi" disabled><svg class="i"><use href="#i-arrow-up"/></svg></button>
        </div>
        <div class="fine"><span>AI có thể sai sót, hãy đối chiếu với tài liệu gốc.</span></div>
      </div>
    </main>

    <!-- Trích dẫn (Right Panel) -->
    <aside class="cites-panel" id="cites-panel" inert>
      <div class="panel-h">
        <span>Trích dẫn <small id="cite-count">0</small></span>
        <button class="icon-btn" id="cites-close" title="Đóng"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="panel-b" id="cites"></div>
    </aside>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
